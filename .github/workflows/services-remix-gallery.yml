name: Services Remix Gallery — Experimental Visual QA
on:
  push:
    branches:
      - phase-b/homepage-reconstruction
    paths:
      - "preview/experiments/services-remix-gallery.html"
      - "tests/experiments/services-remixes.spec.ts"
      - ".github/workflows/services-remix-gallery.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preview-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - name: Test A/B/C at 1100px and 1440px
        run: npx playwright test tests/experiments/services-remixes.spec.ts --reporter=line
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hello-casa-services-remix-visuals
          path: test-results/remix-*.png
          if-no-files-found: ignore
