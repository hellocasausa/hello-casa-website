name: Publish Hello Casa responsive review to GitHub Pages
on:
  push:
    branches:
      - phase-b/homepage-reconstruction
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: hello-casa-responsive-review-pages
  cancel-in-progress: true
jobs:
  publish-review:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - name: Build native site and check types
        run: npm run build
      - name: Verify source architecture
        run: npm run check:architecture
      - name: Compile GitHub Pages site under project path
        run: npx vite build --base=/hello-casa-website/
      - name: Verify built interactive review and asset paths
        run: |
          test -f dist/review/index.html
          test -f dist/index.html
          ls dist/assets/index-*.js > /dev/null
          grep -q '/hello-casa-website/assets/' dist/index.html
          grep -q 'data-view="tablet"' dist/review/index.html
          grep -q 'data-view="mobile"' dist/review/index.html
          test -f dist/assets/0914a207ac7fe63a496e.webp
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload compiled preview to Pages
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist/
      - name: Publish isolated preview (never the production website)
        id: deployment
        uses: actions/deploy-pages@v4
