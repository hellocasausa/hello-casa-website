name: Adjustable Atelier v3 — Experimental Visual QA
on:
  push:
    branches:
      - phase-b/homepage-reconstruction
    paths:
      - "preview/experiments/standards-atelier-adjustable-v3.html"
      - "tests/experiments/standards-atelier-adjustable-v3.spec.ts"
      - ".github/workflows/standards-atelier-adjustable-v3.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  visual-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - name: Verify header line, heading direction, drag and image controllers
        run: npx playwright test tests/experiments/standards-atelier-adjustable-v3.spec.ts --reporter=line
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: atelier-v3-experimental-desktop-screenshots
          path: test-results/atelier-v3-*.png
          if-no-files-found: ignore
